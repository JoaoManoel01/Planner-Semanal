name: Release

on:
  push:
    tags:
      - "v*"

# Criar release é escrita. Sem isto, o GITHUB_TOKEN entra somente-leitura
# (padrão em repositórios novos) e o electron-builder falha ao publicar.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Antes de empacotar: versão quebrada publicada é pior que versão nenhuma,
      # porque o updater a entrega sozinho para quem já tem o app instalado.
      - name: Test
        run: npm test

      - name: Build and publish
        run: npm run electron:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # O electron-builder cria o release como rascunho por padrão, e reaproveita
      # rascunho existente sem alterar o status. Rascunho não aparece em
      # releases/latest/download — exatamente onde o updater busca o latest.yml.
      # Este passo garante o estado final independente do caminho percorrido.
      - name: Tirar do rascunho
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Verificação de efeito, não de etapa: o passo anterior pode ficar verde
      # e o arquivo continuar inacessível para quem vai baixar.
      - name: Conferir que o updater enxerga
        shell: bash
        run: |
          url="https://github.com/${{ github.repository }}/releases/latest/download/latest.yml"
          codigo=$(curl -sL -o /dev/null -w "%{http_code}" "$url")
          echo "latest.yml -> HTTP $codigo"
          test "$codigo" = "200"
